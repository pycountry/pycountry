# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: meta
    hooks:
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # frozen: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/asottile/pyupgrade
    rev: f22ea0651f4355c655cc581f67813c991c74a312  # frozen: v3.22.0
    hooks:
      - id: pyupgrade
        args:
          - --py310-plus
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: 25eba0fb2eb4bd1d59dc69a59cb9976d821106e7  # frozen: v0.9.41
    hooks:
      - id: pymarkdown
        name: pymarkdown-autofix
        args: ["-x-fix", "scan"]
      - id: pymarkdown
        name: pymarkdown
  - repo: https://github.com/dzhu/rstfmt
    rev: 81e5b5eafe45c61b9d1e2410aa16ae39390ad43d  # frozen: v0.0.14
    hooks:
      - id: rstfmt
  - repo: https://github.com/rstcheck/rstcheck
    rev: 27a8027d6c6df787891a01b76e8298bac493fb58  # frozen: v6.3.0
    hooks:
      - id: rstcheck
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        # Don't try to "fix" any spellings in the source data.
        exclude: "^src/pycountry/databases.*$"
        # Avoid requiring an extra dependency on `tomli` by requiring Python 3.11
        # When 3.11 is the lowest version supported, this tag can be dropped.
        language_version: "3.11"
  - repo: https://github.com/sirosen/texthooks
    rev: 269185828704536a959e0b0c4d3f9577e0ea19fb  # frozen: 1.0.0
    hooks:
      # Don't try to fix any of the data files.
      - id: fix-smartquotes
        exclude: "^src/pycountry/databases.*$"
      - id: fix-ligatures
        exclude: "^src/pycountry/databases.*$"
      - id: fix-spaces
        exclude: "^src/pycountry/databases.*$"
      - id: forbid-bidi-controls
        exclude: "^src/pycountry/databases.*$"
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316  # frozen: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-no-eval
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
  - repo: https://github.com/henryiii/validate-pyproject-schema-store
    rev: d406c5ecbe73bed4e187cf9306d6060a47442d1f  # frozen: 2026.10.23
    hooks:
      - id: validate-pyproject
